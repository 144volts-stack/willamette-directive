<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Willamette Room Field Directive</title>
<style>
body { margin:0; background:#1a1a1a; color:#fff; font-family:Arial,sans-serif; }
#zoom { width:100vw; height:100vh; display:flex; flex-direction:column; }
#header { background:#2d2d2d; padding:10px 20px; display:flex; justify-content:space-between; align-items:center; }
#main { display:flex; flex:1; }
#gallery { flex:1; display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:8px; padding:8px; overflow:auto; }
.tile { background:#000; border-radius:8px; position:relative; min-height:140px; display:flex; align-items:center; justify-content:center; font-size:14px; text-align:center; }
.name { position:absolute; bottom:6px; left:6px; background:rgba(0,0,0,0.7); padding:2px 6px; border-radius:4px; font-size:11px; }
#chat { width:280px; background:#2d2d2d; display:flex; flex-direction:column; }
#messages { flex:1; overflow-y:auto; padding:10px; font-size:14px; line-height:1.4; }
#controls { background:#2d2d2d; padding:12px; text-align:center; }
button { margin:4px; padding:10px 18px; background:#0e71eb; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:15px; }
.hidden { display:none; }
</style>
</head>
<body>
<div id="zoom">
  <div id="header"><span>Willamette Room Field Directive</span><span>Zoom Certified™</span></div>
  <div id="main">
    <div id="gallery">
      <div class="tile" id="travis"><div class="name">Travis (Host)</div><div id="ball">Shake the 8-Ball</div></div>
      <div class="tile"><div class="name">CM20</div>Offline<br>Number bonds</div>
      <div class="tile"><div class="name">A30</div>NOT AIR GAPPED</div>
      <div class="tile"><div class="name">Switch</div>Goldfish swimming</div>
      <div class="tile"><div class="name">Comcast</div>Make 10</div>
    </div>
    <div id="chat"><div id="messages"></div></div>
  </div>
  <div id="controls">
    <button id="join" onclick="start()">Join Meeting</button>
    <button class="hidden" id="next" onclick="next()">Continue</button>
  </div>
</div>
<script>
let step = 0;
const messages = document.getElementById('messages');
function addMsg(text) {
  const d = document.createElement('div');
  d.textContent = text;
  messages.appendChild(d);
  messages.scrollTop = messages.scrollHeight;
}
function start() {
  document.getElementById('join').classList.add('hidden');
  document.getElementById('next').classList.remove('hidden');
  addMsg('Travis joined the meeting.');
  addMsg('Shake the 8-Ball.');
}
function next() {
  step++;
  const lines = [
    'Defective switch. Try again.',
    'Turn off energy saving. Not it.',
    'Replace Cat5 cable. Entry point.',
    'He chose poorly.',
    'YOU DIED OF DYSENTERY. YOUR NAME IS TRAVIS.'
  ];
  if (step <= lines.length) addMsg(lines[step-1]);
  if (step >= lines.length) document.getElementById('next').classList.add('hidden');
}
history.pushState(null, null, location.href);
window.onpopstate = () => history.go(1);
</script>
</body>
</html>
