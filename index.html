<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Willamette Room Field Directive</title>
<style>
body { margin:0; background:#0d1117; color:#fff; font-family:Arial,sans-serif; }
#zoom { width:100vw; min-height:100vh; display:flex; flex-direction:column; background:linear-gradient(180deg,#0d1117 0%,#161b22 100%); }
#header { background:#21262d; padding:8px 12px; display:flex; justify-content:space-between; align-items:center; font-size:14px; border-bottom:1px solid #30363d; }
#main { display:flex; flex-direction:column; flex:1; }
#gallery { display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:6px; }
.tile { background:#161b22; border:1px solid #30363d; border-radius:6px; position:relative; min-height:120px; display:flex; align-items:center; justify-content:center; font-size:13px; text-align:center; padding:8px; }
.name { position:absolute; bottom:4px; left:4px; background:rgba(0,0,0,0.7); padding:2px 5px; border-radius:3px; font-size:10px; }
#chat { background:#161b22; max-height:200px; overflow-y:auto; padding:8px; font-size:14px; line-height:1.4; border-top:1px solid #30363d; }
#controls { background:#21262d; padding:12px; text-align:center; position:sticky; bottom:0; border-top:1px solid #30363d; }
button { margin:4px; padding:12px 20px; background:#238636; color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:16px; width:90%; }
.hidden { display:none; }
#instruction { text-align:center; padding:10px; color:#f0c674; font-size:15px; }
</style>
</head>
<body>
<div id="zoom">
  <div id="header"><span>Willamette Room</span><span>Zoom Certified™</span></div>
  <div id="instruction">Tap Join Meeting to start</div>
  <div id="main">
    <div id="gallery">
      <div class="tile"><div class="name">Travis (Host)</div>Shake the 8-Ball</div>
      <div class="tile"><div class="name">CM20</div>Offline<br>Number bonds</div>
      <div class="tile"><div class="name">A30</div>NOT AIR GAPPED</div>
      <div class="tile"><div class="name">Switch</div>Goldfish</div>
      <div class="tile"><div class="name">Comcast</div>Make 10</div>
    </div>
    <div id="chat"><div id="messages"></div></div>
  </div>
  <div id="controls">
    <button id="join" onclick="start()">Join Meeting</button>
    <button class="hidden" id="next" onclick="next()">Continue</button>
  </div>
</div>
<script>
let step = 0;
const messages = document.getElementById('messages');
const instruction = document.getElementById('instruction');
function addMsg(text) {
  const d = document.createElement('div');
  d.textContent = text;
  messages.appendChild(d);
  messages.scrollTop = messages.scrollHeight;
}
function start() {
  document.getElementById('join').classList.add('hidden');
  document.getElementById('next').classList.remove('hidden');
  instruction.textContent = 'Tap Continue to advance';
  addMsg('Travis joined the meeting.');
  addMsg('Shake the 8-Ball.');
}
function next() {
  step++;
  const lines = [
    'Defective switch. Try again.',
    'Turn off energy saving. Not it.',
    'Replace Cat5 cable. Entry point.',
    'He chose poorly.',
    'YOU DIED OF DYSENTERY. YOUR NAME IS TRAVIS.'
  ];
  if (step <= lines.length) addMsg(lines[step-1]);
  if (step >= lines.length) {
    document.getElementById('next').classList.add('hidden');
    instruction.textContent = 'Meeting ended.';
  }
}
history.pushState(null, null, location.href);
window.onpopstate = () => history.go(1);
</script>
</body>
</html>
